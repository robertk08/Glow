<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Glow</title>
<style>
:root{
 --bg:#f2f2f7;--card:#fff;--group:#f2f2f7;--text:#000;
 --sec:rgba(60,60,67,.6);--ter:rgba(60,60,67,.3);--sep:rgba(60,60,67,.29);
 --fill:rgba(118,118,128,.12);--fill2:rgba(118,118,128,.2);--tint:#00c7d4;--bad:#ff3b30;--warn:#ff9500;
 --glass:rgba(255,255,255,.72);--ring:rgba(0,0,0,.06)}
@media(prefers-color-scheme:dark){:root{
 --bg:#000;--card:#1c1c1e;--group:#000;--text:#fff;
 --sec:rgba(235,235,245,.6);--ter:rgba(235,235,245,.3);--sep:rgba(84,84,88,.65);
 --fill:rgba(118,118,128,.24);--fill2:rgba(118,118,128,.36);
 --glass:rgba(30,30,32,.72);--ring:rgba(255,255,255,.08)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);
 font:17px/1.29 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif;
 -webkit-font-smoothing:antialiased;letter-spacing:-.01em}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;letter-spacing:inherit}
#app{display:flex;min-height:100dvh}
#side{display:none;width:230px;flex:none;padding:14px 10px;border-right:.5px solid var(--sep);position:sticky;top:0;height:100dvh}
#side h1{font-size:22px;font-weight:700;margin:8px 12px 14px;letter-spacing:-.02em}
#side button{display:flex;align-items:center;gap:11px;width:100%;padding:8px 11px;border-radius:9px;font-size:16px;color:var(--text)}
#side button.on{background:var(--fill);color:var(--tint);font-weight:600}
main{flex:1;min-width:0;padding-bottom:168px}
#tool{display:flex;align-items:center;gap:9px;padding:calc(10px + env(safe-area-inset-top)) 20px 6px}
#nav{padding:2px 20px 2px;display:flex;align-items:center;gap:10px}
#nav h2{font-size:34px;font-weight:700;letter-spacing:-.025em;margin:0;flex:1;line-height:1.1}
#sub{margin:0 20px;color:var(--sec);font-size:15px}
.act{padding:7px 14px;border-radius:999px;background:var(--card);font-size:15px;font-weight:400;box-shadow:0 0 0 .5px var(--ring),0 1px 3px rgba(0,0,0,.06)}
.act.on{background:var(--tint);color:#fff}
.act.ic{padding:8px 11px;border-radius:50%}
#chips{display:flex;gap:8px;overflow-x:auto;padding:12px 20px 2px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:999px;background:var(--card);font-size:15px;box-shadow:0 0 0 .5px var(--ring),0 1px 3px rgba(0,0,0,.06)}
.chip.on{background:var(--tint);color:#fff}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;padding:14px 20px}
.tile{background:var(--card);border-radius:24px;padding:14px;text-align:left;position:relative;box-shadow:0 0 0 .5px var(--ring),0 1px 3px rgba(0,0,0,.06)}
.tile.on{box-shadow:0 0 0 .5px var(--ring),0 0 0 3px color-mix(in srgb,var(--tint) 40%,transparent)}
.badge{width:38px;height:38px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--sec)}
.tile b{display:block;font-size:17px;font-weight:600;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile small{display:block;font-size:11px;color:var(--sec);font-variant-numeric:tabular-nums;margin-top:1px}
.tile.bad small{color:var(--warn)}
.more{position:absolute;top:10px;right:8px;color:var(--ter);padding:4px 8px;font-size:17px;line-height:1;letter-spacing:1px}
.gauge{height:8px;border-radius:4px;background:var(--fill);margin-top:12px;overflow:hidden;touch-action:none}
.gauge i{display:block;height:100%;background:var(--tint);border-radius:4px}
.sect{font-size:13px;color:var(--sec);margin:24px 20px 7px}
.list{background:var(--card);border-radius:10px;margin:0 16px 18px;overflow:hidden}
.item{display:flex;align-items:center;gap:11px;width:100%;padding:11px 16px;text-align:left;min-height:44px;position:relative}
.item+.item:before{content:'';position:absolute;left:47px;right:0;top:0;height:.5px;background:var(--sep)}
.item b{font-weight:400;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item span:last-child{margin-left:auto;color:var(--sec);font-size:17px;flex:none;display:flex;align-items:center;gap:8px}
.item.on{color:var(--tint)}
.item .ico{width:22px;display:grid;place-items:center}
.chev{color:var(--ter)}
.dots{color:var(--ter);font-size:17px;line-height:1;letter-spacing:1px;padding:2px 6px}
.empty{padding:44px 20px;text-align:center;color:var(--sec);font-size:15px}
.meter{height:6px;border-radius:3px;background:var(--fill);margin:6px auto;max-width:220px}
.none{display:grid;justify-items:center;gap:5px;padding:64px 32px;text-align:center}
.none .mk{color:var(--ter);margin-bottom:4px}
.none h4{font-size:20px;font-weight:600}
.none p{font-size:15px;color:var(--sec);max-width:320px;line-height:1.35}
.none button{margin-top:16px;padding:12px 24px;border-radius:999px;background:var(--tint);color:#fff;font-size:17px;font-weight:600}
.none button[disabled]{opacity:.4}
.tints{display:flex;gap:9px;flex-wrap:wrap;margin-top:7px}
.tn{width:28px;height:28px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.1)}
.tn.on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--tint)}
.meter i{display:block;height:100%;border-radius:3px;background:var(--tint)}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:0 16px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
#dock>*{pointer-events:auto}
#bar{display:flex;align-items:center;gap:12px;height:54px;padding:0 16px;margin:0 auto 8px;max-width:640px;
 background:var(--glass);backdrop-filter:blur(30px) saturate(180%);border-radius:22px;box-shadow:0 0 0 .5px var(--ring),0 4px 16px rgba(0,0,0,.1)}
#tabs{display:flex;justify-content:center;gap:4px;margin:0 auto;max-width:420px;padding:5px;
 background:var(--glass);backdrop-filter:blur(30px) saturate(180%);border-radius:999px;box-shadow:0 0 0 .5px var(--ring),0 4px 16px rgba(0,0,0,.1)}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;color:var(--text);padding:5px 22px;border-radius:999px;flex:1}
#tabs button.on{background:var(--fill);color:var(--tint)}
input[type=range]{-webkit-appearance:none;appearance:none;height:28px;background:none;flex:1;min-width:50px}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--ac,var(--tint)) var(--p,0%),var(--fill2) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.04),0 3px 8px rgba(0,0,0,.15);margin-top:-11.5px}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--ac,var(--tint)) var(--p,0%),var(--fill2) var(--p,0%))}
input[type=range]::-moz-range-thumb{width:27px;height:27px;border:0;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15)}
.num{font-variant-numeric:tabular-nums;color:var(--sec);font-size:15px;min-width:46px;text-align:right}
.pw{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--text);flex:none}
.pw.on{background:var(--bad);color:#fff}
#prog{position:absolute;bottom:100%;left:16px;right:16px;max-height:56dvh;background:var(--card);border-radius:22px;
 box-shadow:0 0 0 .5px var(--ring),0 8px 40px rgba(0,0,0,.22);transform:translateY(calc(100% + 20px));
 transition:transform .3s cubic-bezier(.32,.72,0,1);display:flex;flex-direction:column;margin-bottom:8px}
#prog.up{transform:none}
#grab{padding:8px 0 2px;cursor:pointer}
#grab:after{content:'';display:block;width:36px;height:5px;border-radius:3px;background:var(--fill2);margin:0 auto}
#ptabs{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 10px;scrollbar-width:none;border-bottom:.5px solid var(--sep)}
#ptabs::-webkit-scrollbar{display:none}
#ptabs button{flex:none;padding:6px 13px;border-radius:999px;background:var(--fill);font-size:15px}
#ptabs button.on{background:var(--tint);color:#fff}
#pbody{overflow:auto;padding:6px 16px 18px}
.ctl{display:flex;align-items:center;gap:12px;padding:7px 0}
.ctl label{width:92px;flex:none;font-size:15px;color:var(--sec);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sws{display:flex;gap:10px;flex-wrap:wrap;padding:10px 0}
.sw{width:44px;height:44px;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12);display:grid;place-items:center}
.psect{font-size:13px;color:var(--sec);margin:16px 0 2px}
.psect:first-child{margin-top:4px}
.big{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;margin:2px 0}
.big.sm{font-size:20px}
.mini{color:var(--sec);flex:none;display:grid;place-items:center}
.prow{display:flex;align-items:center;width:100%;padding:12px 0;font-size:17px;border-top:.5px solid var(--sep);margin-top:10px;text-align:left}
.prow .chev{margin-left:auto}
.prow.go{color:var(--tint)}
.prow2{display:flex;gap:9px;margin:10px 0 2px}
.prow2 button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;border-radius:999px;background:var(--fill);font-size:15px}
.crow{padding:9px 0}
.ctop{display:flex;align-items:baseline;gap:10px;font-size:15px;margin-bottom:6px}
.ctop .num{margin-left:auto;font-weight:400;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow input[type=range]{width:100%}
.slots{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:2px}
.slot{padding:6px 11px;border-radius:999px;background:var(--fill);font-size:13px;text-align:left}
.slot.on{background:var(--tint);color:#fff}
#pbody input[type=color]{width:52px;height:30px;border:0;background:none;padding:0}
#pad{width:100%;aspect-ratio:1.7;background:var(--fill);border-radius:18px;position:relative;margin:8px 0;touch-action:none;overflow:hidden}
#pad i{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--tint);transform:translate(-50%,-50%);box-shadow:0 2px 6px rgba(0,0,0,.25)}
#mon{display:flex;gap:1px;align-items:flex-end;height:96px;padding:14px 16px}
#mon i{flex:1;background:var(--tint);min-height:1px}
#veil{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:9;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(2px)}
#veil.up{display:flex}
#sheet{background:var(--card);border-radius:16px;padding:18px;width:100%;max-width:340px;max-height:86dvh;overflow:auto;box-shadow:0 12px 50px rgba(0,0,0,.3)}
#sheet h3{margin:0 0 4px;font-size:17px;font-weight:600;text-align:center}
#sheet p.note{margin:0 0 12px;font-size:13px;color:var(--sec);text-align:center}
#sheet label.f{display:block;font-size:13px;color:var(--sec);margin:10px 0 4px}
#sheet input,#sheet select{width:100%;padding:10px 12px;border-radius:10px;border:0;background:var(--fill);color:var(--text);font:inherit}
#sheet input:focus,#sheet select:focus{outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--tint) 30%,transparent)}
#sheet .opt{display:flex;align-items:center;justify-content:space-between;padding:9px 2px;font-size:16px;border-top:.5px solid var(--sep)}
#sheet .row{display:flex;gap:9px;margin-top:16px}
#sheet .row.col{flex-direction:column}
#sheet .row button{flex:1;padding:11px;border-radius:11px;background:var(--fill);font-size:17px}
#sheet .row button.go{background:var(--tint);color:#fff;font-weight:600}
#sheet .row button.bad{color:var(--bad)}
.tog{width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;flex:none;transition:background .2s}
.tog.on{background:#34c759}
.tog:after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.2);transition:transform .2s}
.tog.on:after{transform:translateX(20px)}
@media(min-width:900px){#side{display:block}#tabs{display:none}main{padding-bottom:96px}#dock{left:230px}
 #prog{position:fixed;top:0;bottom:0;left:auto;right:0;width:390px;max-height:none;border-radius:0;margin:0;
  border-left:.5px solid var(--sep);box-shadow:none;transform:none;display:none}
 #prog.up{display:flex}#grab{display:none}#app.wide #dock{right:390px}}
</style>
</head>

   <div id="nav"><h2>Lights</h2></div><p id="sub"></p><div id="view"></div></main>
</div>
<div id="dock">

</div>
<div id="veil"><div id="sheet"></div></div>

function closest3(t,use){const d=norm3(t),m={};
 for(const a of use){const e=EM[a],mag=e[0]*e[0]+e[1]*e[1]+e[2]*e[2];if(mag<=0)continue;
  m[a]=Math.min(1,Math.max(0,(d[0]*e[0]+d[1]*e[1]+d[2]*e[2])/mag))}
 return peakNorm(m)}
function mixing(t,em,isSub){
 if(isSub){const w=clamp3(norm3(t));return{cyan:1-w[0],magenta:1-w[1],yellow:1-w[2]}}
 const use=em.filter(a=>a!=='uv'&&EM[a]);if(!use.length)return{};
 let res=clamp3(norm3(t));const mix={};
 for(const a of MO){if(!use.includes(a))continue;const e=EM[a];let amt=Infinity;
  for(let i=0;i<3;i++)if(e[i]>0)amt=Math.min(amt,res[i]/e[i]);
  if(!isFinite(amt)||amt<=0)continue;amt=Math.min(amt,1);mix[a]=amt;
  res=clamp3([res[0]-e[0]*amt,res[1]-e[1]*amt,res[2]-e[2]*amt])}
 if(Math.max(0,...Object.values(mix))<=0)return closest3(t,use);
 return peakNorm(mix)}
const emch=t=>t?t.channels.filter(c=>EMS.includes(c.attribute)):[];
const mixes=l=>{const t=T(l);return !!t&&emch(t).length>=3};
const sub=t=>!!t&&t.mixing==='subtractive';
const recipe=(p,l)=>p.uv?{uv:1}:mixing(aim(p),emch(T(l)).map(c=>c.attribute),sub(T(l)));
function applyMix(make){
 for(const l of chosen()){if(!mixes(l))continue;const t=T(l),ec=emch(t),mix=make(l);
  if(sub(t)){for(const c of ec)put(l,c,mix[c.attribute]||0);continue}
  let pk=0;for(const c of ec)pk=Math.max(pk,get(l,c));const lev=pk>0?pk:1,n=peakNorm(mix);
  for(const c of ec)put(l,c,(n[c.attribute]||0)*lev)}
 push()}
function mixLight(m,t){if(sub(t))return clamp3([1-(m.cyan||0),1-(m.magenta||0),1-(m.yellow||0)]);
 let o=[0,0,0];for(const a in m){const e=EM[a];if(!e)continue;o=[o[0]+e[0]*m[a],o[1]+e[1]*m[a],o[2]+e[2]*m[a]]}return o}
function litColor(){const l=chosen().find(mixes);if(!l)return null;const t=T(l),ec=emch(t);
 if(sub(t)){const g=a=>{const c=ec.find(x=>x.attribute===a);return c?get(l,c):0};
  return norm3(clamp3([1-g('cyan'),1-g('magenta'),1-g('yellow')]))}
 let o=[0,0,0];for(const c of ec){const e=EM[c.attribute];if(!e)continue;const v=get(l,c);
  o=[o[0]+e[0]*v,o[1]+e[1]*v,o[2]+e[2]*v]}
 return norm3(o)}
function presets(){const l=chosen().find(mixes);
 return emch(T(l)).some(c=>c.attribute==='uv')?[...PRE,{n:'UV',uv:1}]:PRE}
function pickedPreset(){const l=chosen().find(mixes);if(!l)return null;const t=T(l);
 if(!emch(t).some(c=>get(l,c)>.002))return null;const now=litColor();if(!now)return null;
 let best=null,near=.025;
 for(const p of presets()){const c=norm3(mixLight(recipe(p,l),t));
  const d=Math.hypot(c[0]-now[0],c[1]-now[1],c[2]-now[2]);if(d<near){near=d;best=p.n}}
 return best}
const nearestK=()=>{const c=litColor();if(!c)return 4000;let best=4000,bd=Infinity;
 for(let k=2000;k<=10000;k+=50){const t=kel(k),d=Math.hypot(t[0]-c[0],t[1]-c[1],t[2]-c[2]);if(d<bd){bd=d;best=k}}
 return bd<=.045?best:4000};

let ws,list=null,show=null,node=null,types={},byId={},pick=new Set(),tab='lights',pg=null;
let master=1,black=false,span=24,scene=null,order=false,mode='out';
const U=new Uint8Array(SLOTS+1);
const $=id=>document.getElementById(id);
const raw=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
const b64=a=>btoa(String.fromCharCode(...a));
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ic=(d,s)=>`<svg width="${s||22}" height="${s||22}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
const fresh=()=>Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>b.toString(16).padStart(2,'0')).join('');
const title=a=>a.replace(/([A-Z])/g,' $1').replace(/^./,m=>m.toUpperCase());

function connect(){ws=new WebSocket('ws://'+location.host+'/ws');ws.binaryType='arraybuffer';
 ws.onopen=()=>say({t:'hello',client:'Glow Web',version:2});
 ws.onclose=()=>{paintBar();setTimeout(connect,900)};ws.onmessage=heard}
const on=()=>ws&&ws.readyState===1;
function say(m){if(on())ws.send(JSON.stringify(m))}
function frame(op,s,v){if(!on()||!v.length)return;const b=new Uint8Array(6+v.length);b[0]=op;b[2]=s&255;b[3]=s>>8;b[4]=v.length&255;b[5]=v.length>>8;b.set(v,6);ws.send(b)}
function docFrame(folder,id,body){if(!on())return;const E=new TextEncoder();
 const s=E.encode(list.active),f=E.encode(folder),i=E.encode(id),p=body?E.encode(JSON.stringify(body)):new Uint8Array(0);
 const b=new Uint8Array(7+s.length+f.length+i.length+p.length);
 b[0]=DOC;b[1]=body?0:1;b[2]=s.length;b[3]=f.length;b[4]=i.length;b[5]=p.length&255;b[6]=p.length>>8;
 b.set(s,7);b.set(f,7+s.length);b.set(i,7+s.length+f.length);b.set(p,7+s.length+f.length+i.length);ws.send(b)}
function heard(e){if(typeof e.data==='string')return read(JSON.parse(e.data));
 const p=new Uint8Array(e.data);if(p[0]===DOC)return load();if(p[0]!==SRC)return;
 const st=p[2]|(p[3]<<8),n=p[4]|(p[5]<<8);for(let i=0;i<n;i++)U[st+i]=p[6+i];draw()}
function read(m){
 if(m.t==='status'){node=m;scene=m.scene||null;load()}
 else if(m.t==='doc'||m.t==='shows')load();
 else if(m.t==='master'){master=m.level;paintBar();draw()}
 else if(m.t==='blackout'){black=m.on;paintBar();draw()}
 else if(m.t==='scene'){scene=m.id;if(tab==='scenes')render()}}
async function load(){
 try{list=await(await fetch('/api/shows')).json();show=await(await fetch('/api/show/'+list.active)).json()}catch(e){return}
 for(const k of['lights','groups','made','scenes'])show[k]=(show[k]||[]).sort((a,b)=>(a.sortIndex||0)-(b.sortIndex||0));
 types={};for(const t of show.made)types[t.id]=t;
 byId={};for(const l of show.lights)byId[l.identifier]=l;
 span=24;for(const l of show.lights)span=Math.max(span,l.address+width(l)-1);
 for(const id of[...pick])if(!byId[id])pick.delete(id);
 render()}
const T=l=>types[l.typeID];
function width(l){const t=T(l);if(!t)return 1;let n=1;for(const c of t.channels){n=Math.max(n,c.offset);if(c.fineOffset)n=Math.max(n,c.fineOffset)}return n}
const ch=(t,a)=>t&&t.channels.find(c=>c.attribute===a);
const slot=(l,c)=>l.address+c.offset-1;
function get(l,c){const v=U[slot(l,c)];return c.fineOffset?(v*256+U[l.address+c.fineOffset-1])/65535:v/255}
function put(l,c,v){v=Math.min(1,Math.max(0,v));if(c.fineOffset){const w=Math.round(v*65535);U[slot(l,c)]=w>>8;U[l.address+c.fineOffset-1]=w&255}else U[slot(l,c)]=Math.round(v*255)}
const chosen=()=>[...pick].map(i=>byId[i]).filter(Boolean);
const dim=l=>ch(T(l),'dimmer');
const bright=l=>{const c=dim(l);return c?get(l,c):0};
const clash=l=>{const a=l.address,b=a+width(l)-1;return show.lights.some(o=>o!==l&&T(o)&&a<=o.address+width(o)-1&&o.address<=b)};
function output(){const o=U.slice(1,span+1);
 for(const l of show.lights){const c=dim(l);if(!c)continue;const k=black?0:master;if(k>=1)continue;
  const i=slot(l,c)-1;
  if(c.fineOffset){const j=l.address+c.fineOffset-2,w=Math.round((o[i]*256+o[j])*k);o[i]=w>>8;o[j]=w&255}else o[i]=Math.round(o[i]*k)}
 return o}
function push(){frame(SRC,1,U.slice(1,span+1));frame(OUT,1,output());draw()}
function setAttr(a,v){for(const l of chosen()){const c=ch(T(l),a);if(c)put(l,c,v)}push()}
function defaults(l){const t=T(l);if(!t)return;for(const c of t.channels){U[slot(l,c)]=c.defaultValue||0;if(c.fineOffset)U[l.address+c.fineOffset-1]=c.fineDefaultValue||0}}
const nextIx=a=>a.length?Math.max(...a.map(x=>x.sortIndex||0))+1:1;
const save=(folder,o)=>{docFrame(folder,o.identifier||o.id,o);setTimeout(load,140)};
const drop=(folder,id)=>{docFrame(folder,id,null);setTimeout(load,140)};
const putList=()=>fetch('/api/shows',{method:'PUT',body:JSON.stringify(list)}).then(load);

function render(){
 document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('on',b.dataset.tab===tab);
  b.innerHTML=ic(I[b.dataset.tab],b.closest('#side')?20:23)+'<span>'+N[b.dataset.tab]+'</span>'});
 $('nav').querySelector('h2').textContent=N[tab];
 $('linkbtn').innerHTML=`<span style="color:${on()?'#34c759':'var(--warn)'}">${ic(I.link,20)}</span>`;
 const a=(list.shows||[]).find(s=>s.id===list.active);$('sub').textContent=a?a.name:'';
 $('acts').innerHTML=tab==='lights'?`<button class="act ic${order?' on':''}" data-do="order">${ic(I.order,20)}</button><button class="act ic" data-do="add">${ic(I.plus,20)}</button>`
  :tab==='scenes'?`<button class="act${order?' on':''}" data-do="order"${show.scenes.length?'':' disabled'}>${order?'Done':'Edit'}</button><button class="act ic" data-do="newscene"${show.lights.length?'':' disabled'}>${ic(I.plus,20)}</button>`:'';
 if(tab==='lights')lights();else if(tab==='scenes')scenes();else settings();
 paintBar();programmer()}

 if(show.groups.length){h+='<div id="chips">';
  for(const g of show.groups){const m=show.lights.filter(l=>(l.groups||[]).includes(g.identifier)),sel=m.length&&m.every(l=>pick.has(l.identifier));
   h+=`<button class="chip${sel?' on':''}" data-group="${g.identifier}"${sel?` style="background:${TINTS[g.tint]||'var(--tint)'}"`:''}>${ic(I.stack,15)}${esc(g.name)}</button>`}
  h+='</div>'}
 if(!show.lights.length)h+=`<div class="none"><span class="mk">${ic(I.bulb,52)}</span><h4>No Lights Yet</h4>
  <p>Add the lights on your DMX line, then tap them to take control.</p><button data-do="patch">Add Light</button></div>`;
 else if(order){h+='<div class="list" style="margin-top:14px">';
  show.lights.forEach(l=>h+=`<div class="item"><b>${esc(l.name)}</b><span><button data-up="${l.identifier}">${ic(I.chev,18)}</button><button data-down="${l.identifier}" style="transform:rotate(180deg)">${ic(I.chev,18)}</button></span></div>`);
  h+='</div>'}
 else{h+='<div id="grid">';
  for(const l of show.lights){const t=T(l),bad=!t||clash(l),lit=bright(l)>.004;
   h+=`<div class="tile${pick.has(l.identifier)?' on':''}${bad?' bad':''}" data-light="${l.identifier}">
    <button class="more" data-menu="${l.identifier}">&#8943;</button>
    <div class="badge"${lit&&!bad?' style="background:var(--tint);color:#fff"':bad?' style="background:var(--warn);color:#fff"':''}>${ic(bad?I.warn:I.bulb,20)}</div>
    <b>${esc(l.name)}</b><small>${!t?'Needs a fixture':clash(l)?'Shares channels':l.address+'\u2013'+(l.address+width(l)-1)}</small>

  h+='</div>';
  h+=`<div style="padding:24px 20px"><div class="meter"><i style="width:${Math.min(100,span/SLOTS*100)}%"></i></div><div style="text-align:center;color:var(--sec);font-size:13px;font-variant-numeric:tabular-nums;margin-top:6px">${span} of 512 channels used</div></div>`}
 $('view').innerHTML=h}

function paintBar(){const s=chosen(),mv=Math.round(master*100);
 if(!s.length){$('bar').innerHTML=`<span style="color:var(--sec)">${ic(I.sun,21)}</span><input type="range" id="m" min="0" max="100" value="${mv}" style="${pc(mv,0,100)}"><div class="num">${mv} %</div><button class="pw${black?' on':''}" data-do="black">${ic(I.power,20)}</button>`;
  $('m').oninput=e=>{master=+e.target.value/100;say({t:'master',level:master});push();paintBar()}}
 else{const d=s.some(dim),v=d?Math.round(bright(s.find(dim))*100):0;
  const lit=s.some(x=>bright(x)>.004),c=litColor(),col=lit?(c?rgb(c):'var(--tint)'):'',fg=lit&&c?ink(c):'#fff';
  $('bar').innerHTML=`<button class="badge" data-do="open" style="width:28px;height:28px${lit?`;background:${col};color:${fg}`:''}">${ic(I.bulb,15)}</button><b style="font-size:15px;font-weight:500;white-space:nowrap">${s.length===1?esc(s[0].name):s.length+' Lights'}</b>${on()?'':`<span style="color:var(--warn);display:grid">${ic(I.warn,18)}</span>`}${d?`<input type="range" id="sl" min="0" max="100" value="${v}" style="${pc(v,0,100)}${lit&&c?`;--ac:${col}`:''}"><div class="num">${v} %</div>`:'<div style="flex:1"></div>'}<button class="act" data-do="clear">Clear</button>`;
  if(d)$('sl').oninput=e=>{setAttr('dimmer',+e.target.value/100);paintBar()}}}
const lift=o=>{$('prog').classList.toggle('up',o);$('app').classList.toggle('wide',o)};

function programmer(){const s=chosen();if(!s.length){lift(false);return}
 const has={};for(const l of s){const t=T(l);if(!t)continue;
  for(const c of t.channels){const k=grp(c.attribute);(has[k]=has[k]||[]).push(c.attribute)}}
 const keys=GO.filter(k=>has[k]);if(!keys.length){lift(false);return}
 if(!keys.includes(pg))pg=keys[0];
 $('ptabs').innerHTML=keys.map(k=>`<button data-pg="${k}" class="${k===pg?'on':''}">${GN[k]}</button>`).join('');
 const at=[...new Set(has[pg])];let h='';
 if(pg==='dimmer'){
  if(at.includes('dimmer')){const v=val('dimmer');
   h+=`<div class="psect">Level</div><div class="big" id="big">${v} %</div>
   <div class="ctl"><span class="mini">${ic(I.sunmin,18)}</span><input type="range" min="0" max="100" value="${v}" data-attr="dimmer" style="${pc(v,0,100)}"><span class="mini">${ic(I.sun,18)}</span></div>`}
  h+=sliders(at.filter(a=>a!=='dimmer'))}
 else if(pg==='color'){const l=s.find(mixes);
  if(l){const now=litColor(),sel=pickedPreset();
   h+=`<div class="psect">Color</div><div class="ctl"><label>Color</label><span style="margin-left:auto"><input type="color" id="cp" value="#${hex(now)}"></span></div>
    <div class="sws">${presets().map((p,i)=>{const c=swatch(p);
     return `<button class="sw" data-pre="${i}" title="${p.n}" style="background:${rgb(c)}">${p.n===sel?`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${ink(c)}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4 10-10"/></svg>`:''}</button>`}).join('')}</div>
    <div class="psect">White Balance</div>`;
   h+=at.includes('colorTemperature')?sliders(['colorTemperature']):`<div class="big sm" id="kel">${nearestK()} K</div>
    <div class="ctl"><span class="mini">${ic(I.warmk,18)}</span><input type="range" min="2000" max="10000" step="50" value="${nearestK()}" data-kel="1" style="${pc(nearestK(),2000,10000)}"><span class="mini">${ic(I.coolk,18)}</span></div>`}
  const rest=at.filter(a=>!EMS.includes(a)&&a!=='colorTemperature');

  const ems=at.filter(a=>EMS.includes(a));
  if(ems.length)h+=`<div class="psect">${s.some(x=>sub(T(x)))?'Filters':'Emitters'}</div>`+sliders(ems)}
 else if(pg==='position'){const l=s.find(x=>ch(T(x),'pan')&&ch(T(x),'tilt'));
  if(l){h+=`<div class="psect">Aim</div><div id="pad"><i style="left:${get(l,ch(T(l),'pan'))*100}%;top:${get(l,ch(T(l),'tilt'))*100}%"></i></div>
   <div class="prow2"><button data-do="centre">${ic(I.scope,16)}Centre</button><button data-do="repos">${ic(I.undo,16)}Reset Position</button></div>`}
  h+=sliders(at.filter(a=>a!=='pan'&&a!=='tilt'))}
 else h+=sliders(at);
 if(T(s[0])&&s.every(l=>l.typeID===s[0].typeID))h+=`<button class="prow" data-do="allch">All Channels<span class="chev">${ic(I.chev,17)}</span></button>`;
 h+=`<button class="prow go" data-do="reset">Reset to Defaults</button>`;

 const cp=$('cp');if(cp)cp.oninput=e=>{const v=e.target.value;
  applyMix(l=>mixing([1,3,5].map(i=>parseInt(v.substr(i,2),16)/255),emch(T(l)).map(x=>x.attribute),sub(T(l))));programmer()}}
const val=a=>{const l=chosen().find(x=>ch(T(x),a));return l?Math.round(get(l,ch(T(l),a))*100):0};
const hex=c=>c?c.map(v=>Math.round(Math.min(1,Math.max(0,v))*255).toString(16).padStart(2,'0')).join(''):'ffffff';
const band=(c,v)=>(c.functions||[]).find(f=>v>=f.from&&v<=(f.to===undefined?f.from:f.to));
function row(a){const l=chosen().find(x=>ch(T(x),a));if(!l)return '';const c=ch(T(l),a);

 return `<div class="crow"><div class="ctop"><span>${nm(a)}</span><b class="num">${v}</b></div>
  <input type="range" min="0" max="255" value="${v}" data-raw="${a}" style="${pc(v,0,255)}${EM[a]?`;--ac:${rgb(EM[a])}`:''}"></div>`}
const sliders=at=>at.map(row).join('');
function channelsSheet(){const l=chosen()[0],t=T(l);if(!t)return;
 $('sheet').innerHTML=`<h3>All Channels</h3>`+t.channels.slice().sort((a,b)=>a.offset-b.offset).map(c=>{const v=Math.round(get(l,c)*255);
  return `<div class="crow"><div class="ctop"><span>${c.offset} &nbsp; ${nm(c.attribute)}</span><b class="num">${v}</b></div><input type="range" min="0" max="255" value="${v}" data-raw="${c.attribute}" style="${pc(v,0,255)}"></div>`}).join('')+
  `<div class="row"><button data-x="1">Done</button></div>`;
 $('veil').classList.add('up')}
function putRaw(a,v){for(const l of chosen()){const c=ch(T(l),a);if(c)put(l,c,v/255)}push()}

function draw(){if(!show)return;
 document.querySelectorAll('[data-fader]').forEach(g=>{const l=byId[g.dataset.fader];if(!l)return;
  g.firstElementChild.style.width=bright(l)*100+'%';
  const b=g.closest('.tile').querySelector('.badge');
  if(!b.closest('.tile').classList.contains('bad'))b.style.cssText=bright(l)>.004?'background:var(--tint);color:#fff':''});
 const m=$('mon');if(!m)return;
 if(m.children.length!==span){m.innerHTML='';for(let i=0;i<span;i++)m.appendChild(document.createElement('i'))}
 const o=mode==='out'?output():U.slice(1,span+1);
 for(let i=0;i<span;i++)m.children[i].style.height=Math.max(1,o[i]/255*100)+'%'}

function ask(title,body,go,extra){$('sheet').innerHTML=`<h3>${esc(title)}</h3>${body}<div class="row">${extra||''}<button data-x="1">Cancel</button><button class="go" data-ok="1">Done</button></div>`;
 $('veil').classList.add('up');$('sheet').dataset.go=go;const f=$('sheet').querySelector('input');if(f)f.focus()}
function menuSheet(title,items){$('sheet').innerHTML=`<h3>${esc(title)}</h3><div class="row col" style="margin-top:12px">`+
 items.map((x,n)=>`<button class="${x[2]||''}" data-i="${n}">${x[0]}</button>`).join('')+`<button data-x="1">Cancel</button></div>`;
 $('veil').classList.add('up');
 $('sheet').querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{shut();items[+b.dataset.i][1]()})}
const shut=()=>$('veil').classList.remove('up');
const V=id=>($(id)||{}).value||'';

document.addEventListener('click',e=>{
 const t=e.target.closest('[data-tab],[data-light],[data-scene],[data-group],[data-show],[data-pg],[data-pre],[data-slot],[data-do],[data-menu],[data-smenu],[data-shmenu],[data-type],[data-x],[data-ok],[data-up],[data-down],[data-sup],[data-sdown]');
 if(!t)return;const d=t.dataset;
 if(d.tab){tab=d.tab;order=false;render()}
 else if(d.x)shut();else if(d.ok)commit();
 else if(d.menu)lightMenu(byId[d.menu]);
 else if(d.smenu)sceneMenu(show.scenes.find(s=>s.identifier===d.smenu));
 else if(d.shmenu)showMenu((list.shows||[]).find(s=>s.id===d.shmenu));
 else if(d.type)typeSheet(types[d.type]);
 else if(d.up||d.down)shift('lights',show.lights,d.up||d.down,d.up?-1:1);
 else if(d.sup||d.sdown)shift('scenes',show.scenes,d.sup||d.sdown,d.sup?-1:1);
 else if(d.light){if(!T(byId[d.light]))return lightMenu(byId[d.light]);pick.has(d.light)?pick.delete(d.light):pick.add(d.light);render();lift(pick.size>0)}
 else if(d.group){const m=show.lights.filter(l=>(l.groups||[]).includes(d.group)),all=m.length&&m.every(l=>pick.has(l.identifier));
  m.forEach(l=>all?pick.delete(l.identifier):pick.add(l.identifier));render();lift(pick.size>0)}
 else if(d.scene)recall(show.scenes.find(s=>s.identifier===d.scene));
 else if(d.show)switchTo(d.show);
 else if(d.pg){pg=d.pg;programmer()}
 else if(d.slot){const[a,i]=d.slot.split(':');const l=chosen().find(x=>ch(T(x),a));
  const f=(ch(T(l),a).functions||[])[+i];if(f)putRaw(a,Math.round((f.from+(f.to===undefined?f.from:f.to))/2));programmer()}
 else if(d.pre){const p=presets()[+d.pre];applyMix(l=>recipe(p,l));programmer()}
 else act(d.do)});

function act(a){
 if(a==='open')lift(true);
 else if(a==='shutprog')lift(false);
 else if(a==='link'){tab='settings';render()}
 else if(a==='clear'){pick.clear();lift(false);render()}
 else if(a==='black'){black=!black;say({t:'blackout',on:black});push();paintBar()}
 else if(a==='order'){order=!order;render()}
 else if(a==='mout'||a==='msrc'){mode=a==='mout'?'out':'src';render()}
 else if(a==='reset'){chosen().forEach(defaults);push();programmer();render()}
 else if(a==='allch')channelsSheet();
 else if(a==='centre'){setAttr('pan',.5);setAttr('tilt',.5);programmer()}
 else if(a==='repos'){for(const l of chosen())for(const w of['pan','tilt']){const c=ch(T(l),w);
  if(c){U[slot(l,c)]=c.defaultValue||0;if(c.fineOffset)U[l.address+c.fineOffset-1]=c.fineDefaultValue||0}}push();programmer()}
 else if(a==='newscene')ask('New Scene','<p class="note">Saves what the lights are doing now.</p><input id="f1" placeholder="Name">','scene');
 else if(a==='newshow')ask('New Show','<input id="f1" placeholder="Name">','show');
 else if(a==='add')menuSheet('Add',[['Add Light',()=>act('patch')],['New Group',()=>act('newgroup')]]);
 else if(a==='newgroup'){const g={identifier:fresh(),name:'',sortIndex:nextIx(show.groups),tint:null};show.groups.push(g);editGroup(g)}
 else if(a==='patch'){
  if(!show.made.length)return ask('No Fixture Types','<p class="note">Patch a light in the app first, so this show carries a fixture definition the browser can read.</p>','none');
  ask('Add Lights',`<label class="f">Name</label><input id="f1" placeholder="Light">
   <label class="f">Fixture</label><select id="f2">${show.made.map(t=>`<option value="${t.id}">${esc((t.manufacturer?t.manufacturer+' ':'')+t.model)}</option>`).join('')}</select>
   <label class="f">Start address</label><input id="f3" type="number" min="1" max="512" value="${span+1}">
   <label class="f">How many</label><input id="f4" type="number" min="1" max="64" value="1">`,'light')}}

function commit(){const g=$('sheet').dataset.go;
 if(g==='scene'){const levels={};for(const l of show.lights)levels[l.identifier]=b64(U.slice(l.address,l.address+width(l)));
  save('scenes',{identifier:fresh(),name:V('f1')||'Scene',sortIndex:nextIx(show.scenes),levels})}
 else if(g==='light'){const t=V('f2'),w=(types[t].channels.reduce((m,c)=>Math.max(m,c.offset,c.fineOffset||0),1));
  let at=Math.max(1,+V('f3')||1);const n=Math.max(1,Math.min(64,+V('f4')||1));
  for(let i=0;i<n;i++){save('lights',{identifier:fresh(),typeID:t,name:(V('f1')||'Light')+(n>1?' '+(i+1):''),address:at,sortIndex:nextIx(show.lights)+i,groups:[]});at+=w}}
 else if(g==='show'){const s={id:fresh(),name:V('f1')||'Show'};list.shows.push(s);list.active=s.id;pick.clear();putList()}
 else if(g.startsWith('rn:')){const[,k,id]=g.split(':');
  if(k==='scene'){const s=show.scenes.find(x=>x.identifier===id);s.name=V('f1');save('scenes',s)}
  if(k==='group'){const s=show.groups.find(x=>x.identifier===id);s.name=V('f1');save('groups',s)}
  if(k==='show'){const s=list.shows.find(x=>x.id===id);s.name=V('f1');putList()}}
 else if(g.startsWith('eg:')){const id=g.slice(3),gr=show.groups.find(x=>x.identifier===id);if(gr){
  gr.name=V('f1').trim()||gr.name||'Group';const tn=$('sheet').querySelector('[data-tn].on');
  gr.tint=tn&&tn.dataset.tn!=='none'?tn.dataset.tn:null;save('groups',gr);
  for(const l of show.lights){const box=$('sheet').querySelector(`[data-l="${l.identifier}"]`);if(!box)continue;
   const want=box.classList.contains('on'),has=(l.groups||[]).includes(id);if(want===has)continue;
   l.groups=want?[...(l.groups||[]),id]:(l.groups||[]).filter(x=>x!==id);save('lights',l)}}}
 else if(g.startsWith('ed:')){const l=byId[g.slice(3)];if(l){
  l.name=V('f1')||l.name;l.typeID=V('f2')||l.typeID;l.address=Math.max(1,Math.min(512,+V('f3')||l.address));
  l.invertsPan=$('tp').classList.contains('on');l.invertsTilt=$('tt').classList.contains('on');
  l.groups=[...$('sheet').querySelectorAll('[data-g].on')].map(x=>x.dataset.g);save('lights',l)}}
 shut()}

function lightMenu(l){if(!l)return;
 menuSheet(l.name,[['Edit Light',()=>editLight(l)],['Turn On',()=>{const c=dim(l);if(c)put(l,c,1);push();render()}],
  ['Turn Off',()=>{const c=dim(l);if(c)put(l,c,0);push();render()}],['Reset Light',()=>{defaults(l);push();render()}],
  ['Duplicate',()=>{const c={...l,identifier:fresh(),name:l.name+' 2',address:Math.min(512,l.address+width(l)),sortIndex:nextIx(show.lights)};save('lights',c)}],
  ['Remove Light',()=>{for(let i=0;i<width(l);i++)U[l.address+i]=0;push();pick.delete(l.identifier);drop('lights',l.identifier)},'bad']])}
function editLight(l){
 ask('Edit Light',`<label class="f">Name</label><input id="f1" value="${esc(l.name)}">
  <label class="f">Fixture</label><select id="f2">${show.made.map(t=>`<option value="${t.id}"${t.id===l.typeID?' selected':''}>${esc((t.manufacturer?t.manufacturer+' ':'')+t.model)}</option>`).join('')}</select>
  <label class="f">Address</label><input id="f3" type="number" min="1" max="512" value="${l.address}">
  <label class="f">Groups</label>${show.groups.map(g=>`<div class="opt"><span>${esc(g.name)}</span><div class="tog${(l.groups||[]).includes(g.identifier)?' on':''}" data-g="${g.identifier}"></div></div>`).join('')||'<p class="note" style="text-align:left">No groups yet.</p>'}
  <div class="opt"><span>Invert Pan</span><div class="tog${l.invertsPan?' on':''}" id="tp"></div></div>
  <div class="opt"><span>Invert Tilt</span><div class="tog${l.invertsTilt?' on':''}" id="tt"></div></div>`,'ed:'+l.identifier);
 $('sheet').querySelectorAll('.tog').forEach(t=>t.onclick=()=>t.classList.toggle('on'))}
function editGroup(g){if(!g)return;const named=!!g.name;
 ask(named?'Edit Group':'New Group',`<label class="f">Name</label><input id="f1" value="${esc(g.name)}" placeholder="Group">
  <label class="f">Lights</label>${show.lights.map(l=>`<div class="opt"><span>${esc(l.name)}</span><div class="tog${(l.groups||[]).includes(g.identifier)?' on':''}" data-l="${l.identifier}"></div></div>`).join('')||'<p class="note" style="text-align:left">No lights yet.</p>'}
  <label class="f">Color</label><div class="tints">${['none',...Object.keys(TINTS)].map(n=>`<button class="tn${(g.tint||'none')===n?' on':''}" data-tn="${n}" style="background:${TINTS[n]||'var(--fill2)'}"></button>`).join('')}</div>`,'eg:'+g.identifier);
 $('sheet').querySelectorAll('.tog').forEach(t=>t.onclick=()=>t.classList.toggle('on'));
 $('sheet').querySelectorAll('[data-tn]').forEach(b=>b.onclick=()=>{$('sheet').querySelectorAll('[data-tn]').forEach(x=>x.classList.remove('on'));b.classList.add('on')})}
function groupMenu(g){if(!g)return;menuSheet(g.name||'Group',[['Edit Group',()=>editGroup(g)],
 ['Delete Group',()=>{for(const l of show.lights)if((l.groups||[]).includes(g.identifier)){l.groups=l.groups.filter(x=>x!==g.identifier);save('lights',l)}
  drop('groups',g.identifier)},'bad']])}
function sceneMenu(s){if(!s)return;menuSheet(s.name,[['Recall',()=>recall(s)],['Rename',()=>ask('Rename Scene',`<input id="f1" value="${esc(s.name)}">`,'rn:scene:'+s.identifier)],
 ['Update to Current',()=>{const levels={};for(const l of show.lights)levels[l.identifier]=b64(U.slice(l.address,l.address+width(l)));save('scenes',{...s,levels})}],
 ['Delete Scene',()=>drop('scenes',s.identifier),'bad']])}
function showMenu(s){if(!s)return;menuSheet(s.name,[['Switch To',()=>switchTo(s.id)],['Rename',()=>ask('Rename Show',`<input id="f1" value="${esc(s.name)}">`,'rn:show:'+s.id)],
 ['Delete Show',()=>{if(list.shows.length<2)return;list.shows=list.shows.filter(x=>x.id!==s.id);
  if(list.active===s.id)list.active=list.shows[0].id;fetch('/api/show/'+s.id,{method:'DELETE'}).then(putList)},'bad']])}
function typeSheet(t){if(!t)return;
 $('sheet').innerHTML=`<h3>${esc((t.manufacturer?t.manufacturer+' ':'')+t.model)}</h3><p class="note">${t.channels.length} channels</p>`+
  t.channels.map(c=>`<div class="opt"><span>${c.offset}${c.fineOffset?'+'+c.fineOffset:''} &nbsp; ${nm(c.attribute)}</span><span style="color:var(--sec)">${c.defaultValue||0}</span></div>`).join('')+
  `<div class="row"><button data-x="1">Done</button></div>`;
 $('veil').classList.add('up')}
function shift(folder,arr,id,dir){const i=arr.findIndex(x=>(x.identifier||x.id)===id),j=i+dir;
 if(i<0||j<0||j>=arr.length)return;const a=arr[i],b=arr[j],t=a.sortIndex;a.sortIndex=b.sortIndex;b.sortIndex=t;
 docFrame(folder,a.identifier,a);docFrame(folder,b.identifier,b);setTimeout(load,160)}
function recall(s){if(!s)return;
 for(const l of show.lights){const blob=(s.levels||{})[l.identifier];if(!blob)continue;const v=raw(blob);
  for(let i=0;i<v.length;i++){const k=l.address+i;if(k>SLOTS)break;U[k]=v[i]}}
 scene=s.identifier;say({t:'scene',id:s.identifier});push();render()}
async function switchTo(id){if(id===list.active)return;list.active=id;pick.clear();await putList()}
document.addEventListener('contextmenu',e=>{const c=e.target.closest('[data-group]');if(!c)return;
 e.preventDefault();groupMenu(show.groups.find(g=>g.identifier===c.dataset.group))});
document.addEventListener('input',e=>{const t=e.target,a=t.dataset.attr,r=t.dataset.raw,k=t.dataset.kel;
 if(t.type==='range')t.style.setProperty('--p',Math.round((t.value-t.min)/((t.max-t.min)||1)*100)+'%');
 if(a){setAttr(a,+t.value/100);const n=t.parentNode.querySelector('.num');if(n)n.textContent=t.value+' %';
  const b=$('big');if(b&&a==='dimmer')b.textContent=t.value+' %'}
 else if(r){putRaw(r,+t.value);const n=t.parentNode.querySelector('.num');if(n)n.textContent=t.value}
 else if(k){applyMix(l=>mixing(kel(+t.value),emch(T(l)).map(x=>x.attribute),sub(T(l))));
  const b=$('kel');if(b)b.textContent=t.value+' K'}});
let drag=null;
document.addEventListener('pointerdown',e=>{const g=e.target.closest('[data-fader]');
 if(g){e.preventDefault();drag={f:g.dataset.fader,x:e.clientX,v:bright(byId[g.dataset.fader])};g.setPointerCapture(e.pointerId);return}
 const p=e.target.closest('#pad');if(p){drag={pad:p};padMove(e)}});
document.addEventListener('pointermove',e=>{if(!drag)return;if(drag.pad)return padMove(e);
 const l=byId[drag.f],c=dim(l);if(!c)return;put(l,c,drag.v+(e.clientX-drag.x)/180);push();paintBar()});
document.addEventListener('pointerup',()=>drag=null);
function padMove(e){const r=drag.pad.getBoundingClientRect();
 const x=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),y=Math.min(1,Math.max(0,(e.clientY-r.top)/r.height));
 setAttr('pan',x);setAttr('tilt',y);drag.pad.firstElementChild.style.left=x*100+'%';drag.pad.firstElementChild.style.top=y*100+'%'}
connect();load();
</script>
</body>
</html>
