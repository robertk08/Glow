<!doctype html><meta charset="utf-8"><style>
body{font:12px -apple-system,sans-serif;background:#fff;margin:18px;color:#444}
h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#888;margin:20px 0 8px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.b{text-align:center}
.f{width:132px;height:132px;background:#f6f6f7;border:1px solid #ddd;border-radius:30px;
   position:relative;overflow:hidden}
.f img{position:absolute;inset:0;width:100%;height:100%}
.g{width:132px;height:132px;border-radius:30px;display:flex;align-items:center;justify-content:center;
   background:linear-gradient(160deg,#5b2bd9,#c2178b 55%,#ff7a2f)}
.g img{width:64%}
cap{display:block;margin-top:5px;color:#999}
.n img{height:130px;width:auto}
</style>
<h3>A — head aimed 45° (yoke stays upright)</h3>
<div class="row">
<div class="b n"><img src="artwork-5x/tilt45/symbol.fill.svg"><cap>symbol.fill</cap></div>
<div class="b n"><img src="artwork-5x/tilt45/symbol.outline.svg"><cap>outline</cap></div>
<div class="b"><div class="f"><img src="icon-composer-45/tilt-45/symbol.svg"></div><cap>icon canvas</cap></div>
<div class="b"><div class="f"><img src="icon-composer-45/tilt-45/head.svg"></div><cap>head layer</cap></div>
<div class="b"><div class="g"><img src="icon-composer-45/tilt-45/symbol.svg" style="filter:invert(1)"></div><cap>on colour</cap></div>
</div>
<h3>B — whole symbol turned 45°</h3>
<div class="row">
<div class="b n"><img src="artwork-5x/rotated45/symbol.fill.svg"><cap>symbol.fill</cap></div>
<div class="b n"><img src="artwork-5x/rotated45/symbol.outline.svg"><cap>outline</cap></div>
<div class="b"><div class="f"><img src="icon-composer-45/rotated-45/symbol.svg"></div><cap>icon canvas</cap></div>
<div class="b"><div class="f"><img src="icon-composer-45/rotated-45/head.svg"></div><cap>head layer</cap></div>
<div class="b"><div class="g"><img src="icon-composer-45/rotated-45/symbol.svg" style="filter:invert(1)"></div><cap>on colour</cap></div>
</div>
