<!doctype html><meta charset="utf-8"><style>
body{font:12px -apple-system,sans-serif;background:#fff;margin:18px;color:#444}
h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#888;margin:22px 0 8px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.b{text-align:center}
.f{width:140px;height:140px;background:#f6f6f7;border:1px solid #ddd;border-radius:32px;
   position:relative;overflow:hidden}
.f img{position:absolute;inset:0;width:100%;height:100%}
.g{width:140px;height:140px;border-radius:32px;display:flex;align-items:center;justify-content:center;
   background:linear-gradient(160deg,#5b2bd9,#c2178b 55%,#ff7a2f);position:relative;overflow:hidden}
.g img{position:absolute;inset:0;width:100%;height:100%;filter:invert(1)}
cap{display:block;margin-top:5px;color:#999}
.n img{height:140px;width:auto}
</style>
<h3>turned 45° — head and light, separate files, no yoke</h3>
<div class="row">
<div class="b n"><img src="head-light/turned-45/head.svg"><cap>head.svg</cap></div>
<div class="b n"><img src="head-light/turned-45/light.svg"><cap>light.svg</cap></div>
<div class="b n"><img src="head-light/turned-45/both.svg"><cap>both (stacked)</cap></div>
<div class="b n"><img src="head-light/turned-45/both.outline.svg"><cap>outline</cap></div>
<div class="b"><div class="f"><img src="head-light/turned-45/square-1024/head.svg"><img src="head-light/turned-45/square-1024/light.svg"></div><cap>1024 layers stacked</cap></div>
<div class="b"><div class="g"><img src="head-light/turned-45/square-1024/both.svg"></div><cap>on colour</cap></div>
</div>
<h3>straight, same split</h3>
<div class="row">
<div class="b n"><img src="head-light/straight/head.svg"><cap>head.svg</cap></div>
<div class="b n"><img src="head-light/straight/light.svg"><cap>light.svg</cap></div>
<div class="b n"><img src="head-light/straight/both.svg"><cap>both</cap></div>
<div class="b"><div class="g"><img src="head-light/straight/square-1024/both.svg"></div><cap>on colour</cap></div>
</div>
